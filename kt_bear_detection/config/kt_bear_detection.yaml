kt_bear_detection:
  ros__parameters:
    image_topic: "/tianracer/camera/image_raw"
    output_topic: "/bear_detection/targets"
    target_type: "bear"
    box_format: "cxcywh"
    score_threshold: 0.71
    nms_threshold: 0.70
    nms_top_k: 300
    stable_required_hits: 2
    stable_match_radius_px: 140.0
    stable_max_track_age_ms: 200
    task_num: 4
    log_fps: false
    log_detections: false
    publish_debug_log: true
    debug_raw_candidates: false
    debug_bbox_mapping: false
    max_targets: 1
    debug_post_nms_candidates: false
    debug_post_nms_top_k: 8
    debug_dump_input_once: false
